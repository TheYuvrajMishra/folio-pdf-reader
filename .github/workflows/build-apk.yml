# Folio M0 — build a signed release APK and publish it.
#
# Triggers: version tags (v*) and manual runs (workflow_dispatch).
# Signing: the Expo prebuild template already signs the `release` build type
# with its bundled android/app/debug.keystore (verified locally 2026-10-17;
# see docs/DECISIONS.md). The "Ensure keystore" step below is a safety net
# in case a future template drops the keystore.

name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Bundle pdf.js (offline engine artifacts)
        run: node scripts/bundle-pdfjs.mjs

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Ensure keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "debug.keystore missing — generating one"
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore present"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="build-$GITHUB_RUN_NUMBER"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "folio-$TAG.apk"
          gh release create "$TAG" "folio-$TAG.apk" --title "Folio $TAG" --generate-notes --target "$GITHUB_SHA" || gh release upload "$TAG" "folio-$TAG.apk" --clobber
